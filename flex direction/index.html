<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex direction</title>
    <style>
        .container {
            color: white;
            flex-direction: column;
            display: flex;
            font-size: 10px;
            text-align: center;
            margin: 5px;
            border: 5px solid gold;
            width: 60px;
            height: 595px;
        }
        .red{
            color: white;
            background-color: red;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
        .orange{
            color: white;
            background-color: orange;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
        .yellow{
            color: black;
            background-color: yellow;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
        .green{
            color: white;
            background-color: green;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
        .blue{
            color: white;
            background-color: blue;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
        .indigo{
            color: white;
            background-color: indigo;
            height: 200px;
            width: 100%;
            font-size: 20px;    
        }
        .purple{
            color: white;
            background-color: purple;
            height: 200px;
            width: 100%;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="red">Red</div>
        <div class="orange">Orange</div>
        <div class="yellow">Yellow</div>
        <div class="green">Green</div>
        <div class="blue">Blue</div>
        <div class="indigo">Indigo</div>
        <div class="purple">Purple</div>
    </div>
</body>
</html>
